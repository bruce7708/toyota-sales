<title>TOYOTA 促銷文案產生器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: #f2f2f2;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Helvetica Neue", sans-serif;
    color: #1a1a1a;
    min-height: 100vh;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 48px;
    background: #fff;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: #cc0000;
    padding: 18px 18px 14px;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    font-size: 26px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 4px;
  }
  .consultant-info { text-align: right; }
  .consultant-name { font-size: 13px; color: #fff; font-weight: bold; }
  .consultant-tel  { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 2px; }
  .dealer-block {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.3);
  }
  .dealer-name { font-size: 12px; color: #fff; font-weight: bold; letter-spacing: 1px; }
  .dealer-addr { font-size: 11px; color: rgba(255,255,255,0.75); margin-top: 3px; }
  .tool-subtitle { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 6px; letter-spacing: 1px; }

  /* ── Progress bar ── */
  .progress {
    display: flex;
    gap: 4px;
    padding: 0;
    background: #b30000;
  }
  .dot {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.25);
    transition: background 0.3s;
  }
  .dot.active { background: #fff; }
  .dot.done   { background: rgba(255,255,255,0.7); }

  /* ── Body ── */
  .body { padding: 16px 16px; }

  .step-title {
    font-size: 11px;
    color: #cc0000;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: bold;
  }

  /* ── Cards grid ── */
  .grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .card {
    background: #fafafa;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    padding: 8px 6px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    user-select: none;
  }
  .card.active {
    background: #fff5f5;
    border-color: #cc0000;
  }
  .card-emoji { font-size: 18px; margin-bottom: 3px; }
  .card-name  { font-size: 12px; font-weight: bold; color: #333; }
  .card.active .card-name { color: #cc0000; }
  .card-sub   { font-size: 10px; color: #888; margin-top: 2px; }
  .card-price { font-size: 10px; color: #aaa; margin-top: 3px; }
  .card.active .card-price { color: #cc0000; }

  /* ── Target cards ── */
  .target-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    text-align: left;
  }
  .target-card .t-emoji { font-size: 20px; flex-shrink: 0; }
  .target-card .t-label { font-size: 13px; font-weight: bold; color: #333; }
  .target-card.active .t-label { color: #cc0000; }

  /* ── Type cards ── */
  .type-card { padding: 16px 10px; }
  .type-card .t-icon { font-size: 22px; margin-bottom: 6px; }
  .type-card .t-name { font-size: 13px; font-weight: bold; color: #333; }
  .type-card.active .t-name { color: #cc0000; }
  .type-card .t-full { font-size: 10px; color: #999; margin-top: 2px; }

  /* ── Buttons ── */
  .btn-next {
    width: 100%;
    padding: 14px;
    background: #cc0000;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 12px;
    letter-spacing: 1px;
    font-family: inherit;
  }
  .btn-next:disabled {
    background: #ddd;
    color: #aaa;
    cursor: not-allowed;
  }
  .btn-back {
    background: transparent;
    border: 1px solid #ddd;
    border-radius: 7px;
    color: #888;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 12px;
    font-family: inherit;
  }

  /* ── Promo step ── */
  .field-label { font-size: 13px; color: #555; margin-bottom: 6px; }
  select.promo-select {
    width: 100%;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    color: #1a1a1a;
    padding: 11px 14px;
    font-size: 15px;
    margin-bottom: 14px;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  textarea.note-input {
    width: 100%;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    color: #1a1a1a;
    padding: 11px 14px;
    font-size: 14px;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
  }
  textarea.note-input::placeholder { color: #bbb; }

  /* ── Result ── */
  .result-label {
    font-size: 11px;
    color: #cc0000;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: bold;
  }
  .result-box {
    background: #fff;
    border: 1px solid #ddd;
    border-left: 4px solid #cc0000;
    border-radius: 6px;
    padding: 16px;
    font-size: 14px;
    line-height: 1.9;
    color: #1a1a1a;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .btn-copy {
    width: 100%;
    padding: 13px;
    background: #cc0000;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 12px;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-copy.copied {
    background: #2e7d32;
  }
  .btn-reset {
    width: 100%;
    padding: 12px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    color: #666;
    font-size: 14px;
    cursor: pointer;
    margin-top: 8px;
    font-family: inherit;
  }
  .switch-types { margin-top: 20px; text-align: center; }
  .switch-label { font-size: 12px; color: #999; margin-bottom: 8px; }
  .switch-btns  { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btn-switch {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 20px;
    color: #555;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }

  .tool-menu {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 4px;
  }
  .tool-card {
    background: #fafafa;
    border: 1.5px solid #e0e0e0;
    border-radius: 12px;
    padding: 16px 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    user-select: none;
  }
  .tool-card:active { background: #fff5f5; border-color: #cc0000; }
  .tool-icon { font-size: 26px; margin-bottom: 6px; }
  .tool-name { font-size: 13px; font-weight: bold; color: #1a1a1a; margin-bottom: 4px; }
  .tool-desc { font-size: 10px; color: #999; line-height: 1.4; }

  .gap10 { display: flex; flex-direction: column; gap: 8px; }
</style>

function buildRival(car, rivalName, note) {
  const c = car.name;
  const { name, mobile } = CONSULTANT;

  const pts = rivalData.points;
  const noteExtra = note ? `\n\n📌 補充：${note}` : "";

// ── 貸款試算 ──────────────────────────────────────────────
function calcLoan(price, down, months, rate) {
  const principal = price - down;
  if (principal <= 0 || months <= 0) return null;
  const monthlyRate = rate / 100 / 12;
  let monthly;
  if (monthlyRate === 0) {
    monthly = principal / months;
  } else {
    monthly = principal * monthlyRate * Math.pow(1+monthlyRate, months) / (Math.pow(1+monthlyRate, months) - 1);
  }
  const total = monthly * months + down;
  const interest = total - price;
  return { monthly: Math.round(monthly), total: Math.round(total), interest: Math.round(interest), principal };
}

function buildLoanScript(car, price, down, months, rate, note) {
  const res = calcLoan(price, down, months, rate);
  if (!res) return "請確認輸入數值後重新試算。";
  const { name, mobile } = CONSULTANT;
  const carName = car ? "Toyota " + car.name : "您選擇的車款";
  const noteExtra = note ? `\n\n📌 ${note}` : "";
  const planLabel = LOAN_PLANS.find(p => p.months === months)?.label || months + "期";

  return `【${carName} 貸款試算說明】

您好！根據您的需求，我幫您試算了以下方案 😊

━━━━━━━━━━━━━━━
📋 試算條件
  車價：${price.toLocaleString()} 元
  頭期款：${down.toLocaleString()} 元（${Math.round(down/price*100)}%）
  貸款金額：${res.principal.toLocaleString()} 元
  貸款期數：${planLabel}
  年利率：${rate}%
━━━━━━━━━━━━━━━
💰 試算結果
  每月月付：約 ${res.monthly.toLocaleString()} 元
  總利息：約 ${res.interest.toLocaleString()} 元
  總支出：約 ${res.total.toLocaleString()} 元
━━━━━━━━━━━━━━━

💡 小提醒：
• 以上為參考試算，實際利率依個人信用評等與金融機構核貸結果為準
• 頭期款越高、期數越短，總利息越少
• 若有良好信用記錄，有機會申請到更優惠的利率方案
• 我們可協助您向多家銀行詢價，找到最適合您的方案${noteExtra}

有任何問題歡迎隨時詢問！
📞 ${name} 顧問 ${mobile}`;
}

// ── 進度條更新 ────────────────────────────────────────────
function updateProgress(step, total) {
  for (let i = 0; i < 5; i++) {
    const el = document.getElementById("d" + i);
    if (!el) continue;
    if (i < total) {
      el.style.display = "";
      el.className = "dot" + (i < step ? " done" : i === step ? " active" : "");
    } else {
      el.style.display = "none";
    }
  }
}

// ── 複製 ──────────────────────────────────────────────────
function copyText(text) {
  if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(() => fallbackCopy(text)); }
  else { fallbackCopy(text); }
}
function fallbackCopy(text) {
  const el = document.createElement("textarea");
  el.value = text; el.style.position = "fixed"; el.style.opacity = "0";
  document.body.appendChild(el); el.focus(); el.select();
  try { document.execCommand("copy"); } catch(e) {}
  document.body.removeChild(el);
}
function escapeHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── 結果頁共用 HTML ───────────────────────────────────────
function resultHtml(label, content, switchTypes) {
  let html = `<div class="result-label">${label}</div>`;
  html += `<div class="result-box">${escapeHtml(content)}</div>`;
  html += `<button class="btn-copy" id="copyBtn" onclick="doCopy()">📋 複製內容</button>`;
  html += `<button class="btn-reset" onclick="goHome()">🏠 回主選單</button>`;
  if (switchTypes) {
    html += `<div class="switch-types"><div class="switch-label">同樣設定，換個文案類型</div><div class="switch-btns">`;
    TYPES.filter(t => t.id !== state.typeId).forEach(t => {
      html += `<button class="btn-switch" onclick="switchType('${t.id}')">${t.label}</button>`;
    });
    html += `</div></div>`;
  }
  return html;
}

// ── 主渲染 ────────────────────────────────────────────────
function render() {
  const body = document.getElementById("body");
  window.scrollTo(0, 0);

  // ── 主選單 ──
  if (!state.tool) {
    updateProgress(0, 0);
    body.innerHTML = `
      <div class="step-title">選擇功能</div>
      <div class="tool-menu">
        <div class="tool-card" onclick="startTool('copy')">
          <div class="tool-icon">✍️</div>
          <div class="tool-name">促銷文案生成</div>
          <div class="tool-desc">LINE / FB / 話術 / 邀請信</div>
        </div>
        <div class="tool-card" onclick="startTool('rival')">
          <div class="tool-icon">⚔️</div>
          <div class="tool-name">競品比較話術</div>
          <div class="tool-desc">客戶提到競品時的應對</div>

        <div class="tool-card" onclick="startTool('loan')">
          <div class="tool-icon">🧮</div>
          <div class="tool-name">貸款試算說明</div>

          <div class="tool-name">客戶跟進腳本</div>
          <div class="tool-desc">試乘後/沉默客戶/月底衝業績</div>
        </div>
      </div>`;
    return;
  }

  // ══ 促銷文案 ══════════════════════════════════════════
  if (state.tool === "copy") {
    if (state.step === 0) {
      updateProgress(0, 4);
      let html = `<button class="btn-back" onclick="goHome()">← 返回</button>`;
      html += `<div class="step-title">① 選擇車款</div><div class="grid2">`;
      CARS.forEach((c, i) => {
        const active = state.car && state.car.name === c.name ? " active" : "";
        html += `<div class="card${active}" onclick="selectCar(${i})">
          <div class="card-emoji">${c.emoji}</div>
          <div class="card-name">${c.name}</div>
          <div class="card-sub">${c.tag}</div>
          <div class="card-price">${c.price}</div>
        </div>`;
      });
      html += `</div><button class="btn-next" onclick="goStep(1)" ${state.car?"":"disabled"}>下一步 →</button>`;
      body.innerHTML = html;

    } else if (state.step === 1) {
      updateProgress(1, 4);
      let html = `<button class="btn-back" onclick="goStep(0)">← 返回</button>`;
      html += `<div class="step-title">② 目標客群</div><div class="gap10">`;
      TARGETS.forEach((t, i) => {
        const active = state.target && state.target.id === t.id ? " active" : "";
        const parts = t.label.split(" ");
        html += `<div class="card target-card${active}" onclick="selectTarget(${i})">
          <div class="t-emoji">${parts[0]}</div>
          <div><div class="t-label">${parts.slice(1).join(" ")}</div><div class="card-sub">${t.desc}</div></div>
        </div>`;
      });
      html += `</div><button class="btn-next" onclick="goStep(2)" ${state.target?"":"disabled"}>下一步 →</button>`;
      body.innerHTML = html;

    } else if (state.step === 2) {
      updateProgress(2, 4);
      let html = `<button class="btn-back" onclick="goStep(1)">← 返回</button>`;
      html += `<div class="step-title">③ 文案類型</div><div class="grid2">`;
      TYPES.forEach(t => {
        const active = state.typeId === t.id ? " active" : "";
        const parts = t.label.split(" ");
        html += `<div class="card type-card${active}" onclick="selectType('${t.id}')">
          <div class="t-icon">${parts[0]}</div><div class="t-name">${parts.slice(1).join(" ")}</div>
          <div class="t-full">${t.full}</div>
        </div>`;
      });
      html += `</div><button class="btn-next" onclick="goStep(3)" ${state.typeId?"":"disabled"}>下一步 →</button>`;
      body.innerHTML = html;

    } else if (state.step === 3) {
      updateProgress(3, 4);
      let html = `<button class="btn-back" onclick="goStep(2)">← 返回</button>`;
      html += `<div class="step-title">④ 促銷設定（可選）</div>`;
      html += `<div class="field-label">促銷活動</div>`;
      html += `<select class="promo-select" onchange="setPromo(this.value)">`;
      PROMO_LIST.forEach(p => { html += `<option value="${p}" ${state.promo===p?"selected":""}>${p}</option>`; });
      html += `</select>`;
      html += `<div class="field-label">補充說明（可留空）</div>`;
      html += `<textarea class="note-input" placeholder="例：本月底交車再折5,000..." oninput="setNote(this.value)">${state.note}</textarea>`;
      html += `<button class="btn-next" onclick="generateCopy()">✨ 立即生成文案</button>`;
      body.innerHTML = html;

    } else if (state.step === 4) {
      updateProgress(4, 4);
      const typeFull = (TYPES.find(t => t.id === state.typeId)||{}).full||"";
      body.innerHTML = resultHtml(state.car.name + " × " + typeFull, state.result, true);
    }
    return;
  }

  // ══ 競品比較 ══════════════════════════════════════════
  if (state.tool === "rival") {
    if (state.step === 0) {
      updateProgress(0, 3);
      let html = `<button class="btn-back" onclick="goHome()">← 返回</button>`;
      html += `<div class="step-title">① 選擇我方車款</div><div class="grid2">`;
      CARS.forEach((c, i) => {
        const hasRivals = RIVALS[c.name] && RIVALS[c.name].length > 0;
        if (!hasRivals) return;
        const active = state.car && state.car.name === c.name ? " active" : "";
        html += `<div class="card${active}" onclick="selectCar(${i})">
          <div class="card-emoji">${c.emoji}</div>
          <div class="card-name">${c.name}</div>
          <div class="card-sub">${c.tag}</div>
        </div>`;
      });
      html += `</div><button class="btn-next" onclick="goStep(1)" ${state.car?"":"disabled"}>下一步 →</button>`;
      body.innerHTML = html;

    } else if (state.step === 1) {
      updateProgress(1, 3);
      const rivals = RIVALS[state.car.name] || [];
      let html = `<button class="btn-back" onclick="goStep(0)">← 返回</button>`;
      html += `<div class="step-title">② 選擇競品車款</div><div class="gap10">`;
      rivals.forEach(r => {
        const active = state.rivalName === r.name ? " active" : "";
        html += `<div class="card target-card${active}" onclick="selectRival('${r.name}')">
          <div class="t-emoji">🆚</div>
          <div><div class="t-label">${r.name}</div></div>
        </div>`;
      });
      html += `</div>`;
      html += `<div class="field-label" style="margin-top:14px">補充說明（可留空）</div>`;
      html += `<textarea class="note-input" placeholder="例：客戶說競品比較省油、客戶很在意外觀..." oninput="setNote(this.value)">${state.note}</textarea>`;
      html += `<button class="btn-next" onclick="generateRival()" ${state.rivalName?"":"disabled"}>生成比較話術</button>`;
      body.innerHTML = html;

    } else if (state.step === 2) {
      updateProgress(2, 3);
      body.innerHTML = resultHtml(state.car.name + " vs " + state.rivalName, state.result, false);
    }
    return;
  }

  // ══ 貸款試算 ══════════════════════════════════════════
  if (state.tool === "loan") {
    if (state.step === 0) {
      updateProgress(0, 2);
      let html = `<button class="btn-back" onclick="goHome()">← 返回</button>`;
      html += `<div class="step-title">🧮 貸款試算</div>`;

      html += `<div class="field-label">車款（可選）</div>`;
      html += `<select class="promo-select" onchange="setLoanCar(this.value)">`;
      html += `<option value="">-- 不指定車款 --</option>`;
      CARS.forEach((c,i) => { html += `<option value="${i}" ${state.car&&state.car.name===c.name?'selected':''}>${c.name}（${c.price}）</option>`; });
      html += `</select>`;

      html += `<div class="field-label">車價（元）</div>`;
      html += `<input class="note-input" style="min-height:0;padding:11px 14px" type="number" placeholder="例：799000" value="${state.loanPrice}" oninput="state.loanPrice=this.value" />`;

      html += `<div class="field-label" style="margin-top:10px">頭期款（元）</div>`;
      html += `<input class="note-input" style="min-height:0;padding:11px 14px" type="number" placeholder="例：200000" value="${state.loanDown}" oninput="state.loanDown=this.value" />`;

      html += `<div class="field-label" style="margin-top:10px">貸款期數</div>`;
      html += `<div class="grid2" style="gap:6px;margin-bottom:10px">`;
      LOAN_PLANS.forEach(p => {
        const active = state.loanMonths === p.months ? " active" : "";
        html += `<div class="card${active}" style="padding:10px 6px" onclick="setLoanMonths(${p.months})">
          <div class="card-name">${p.label}</div>
        </div>`;
      });
      html += `</div>`;

      html += `<div class="field-label">年利率（%）</div>`;
      html += `<input class="note-input" style="min-height:0;padding:11px 14px" type="number" step="0.01" placeholder="例：1.99" value="${state.loanRate}" oninput="state.loanRate=parseFloat(this.value)||0" />`;

      html += `<div class="field-label" style="margin-top:10px">補充說明（可留空）</div>`;
      html += `<textarea class="note-input" style="min-height:60px" placeholder="例：加贈延長保固、額外折扣..." oninput="setNote(this.value)">${state.note}</textarea>`;

      html += `<button class="btn-next" onclick="generateLoan()">🧮 立即試算</button>`;
      body.innerHTML = html;

    } else if (state.step === 1) {
      updateProgress(1, 2);
      body.innerHTML = resultHtml("貸款試算結果", state.result, false);
    }
    return;
  }

  // ══ 客戶跟進 ══════════════════════════════════════════
  if (state.tool === "followup") {
    if (state.step === 0) {
      updateProgress(0, 2);
      let html = `<button class="btn-back" onclick="goHome()">← 返回</button>`;
      html += `<div class="step-title">① 選擇跟進情境</div><div class="gap10">`;
      FOLLOWUP_SCENARIOS.forEach(s => {
        const active = state.followupScenario === s.id ? " active" : "";

      html += `<div class="field-label" style="margin-top:14px">車款（可選）</div>`;

      html += `<div class="field-label">補充說明（可留空）</div>`;
      html += `<textarea class="note-input" placeholder="例：客戶上週試乘過RAV4、正在比較競品..." oninput="setNote(this.value)">${state.note}</textarea>`;
      html += `<button class="btn-next" onclick="generateFollowup()" ${state.followupScenario?"":"disabled"}>生成跟進腳本</button>`;
      body.innerHTML = html;

    } else if (state.step === 1) {

      body.innerHTML = resultHtml((sc ? sc.label : "跟進腳本"), state.result, false);
    }
    return;
  }
}

// ── 操作函數 ──────────────────────────────────────────────
function goHome() {
  state.tool = null; state.step = 0; state.result = "";
  state.car = null; state.rivalName = null; state.followupScenario = null; state.note = "";
  render();
}
function startTool(t) { state.tool = t; state.step = 0; state.result = ""; state.note = ""; render(); }
function goStep(n) { state.step = n; render(); }
function selectCar(i) { state.car = CARS[i]; render(); }
function selectTarget(i) { state.target = TARGETS[i]; render(); }
function selectType(id) { state.typeId = id; render(); }
function setPromo(v) { state.promo = v; }
function setNote(v) { state.note = v; }
function selectRival(name) { state.rivalName = name; render(); }
function setLoanMonths(m) { state.loanMonths = m; render(); }
function setLoanCar(v) { state.car = v !== "" ? CARS[parseInt(v)] : null; }
function selectFollowup(id) { state.followupScenario = id; render(); }
function setFollowupCar(v) { state.car = v !== "" ? CARS[parseInt(v)] : null; }

function generateCopy() {
  state.result = buildContent(state.car, state.target.id, state.typeId, state.promo, state.note);
  state.step = 4; render();
}
function generateRival() {
  state.result = buildRival(state.car, state.rivalName, state.note);
  state.step = 2; render();
}
function generateLoan() {
  const price = parseInt(state.loanPrice) || 0;
  const down  = parseInt(state.loanDown)  || 0;
  if (!price || price <= 0) { alert("請輸入有效車價"); return; }
  state.result = buildLoanScript(state.car, price, down, state.loanMonths, state.loanRate, state.note);
  state.step = 1; render();
}
function generateFollowup() {
  state.result = buildFollowup(state.car, state.followupScenario, state.note);
  state.step = 1; render();
}
function switchType(id) {
  state.typeId = id;
  state.result = buildContent(state.car, state.target.id, id, state.promo, state.note);
  render();
}
function doCopy() {
  copyText(state.result);
  const btn = document.getElementById("copyBtn");
  if (btn) {
    btn.textContent = "✓ 已複製到剪貼簿！";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "📋 複製內容"; btn.classList.remove("copied"); }, 2000);
  }
}

// ── 初始化 ────────────────────────────────────────────────
render();

</script>
